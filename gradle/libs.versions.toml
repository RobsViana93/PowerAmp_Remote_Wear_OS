[versions]
agp = "9.1.1"
kotlin = "2.2.10"
compose-bom = "2026.09.00"
activity = "1.13.0"
wear-compose = "1.7.1"
wearable = "20.0.1"
lifecycle = "2.11.0"
coroutines = "1.10.2"
core = "1.18.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "core" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
wear-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }

play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "wearable" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
